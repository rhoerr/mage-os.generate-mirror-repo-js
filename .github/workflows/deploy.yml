name: "[workflow call] Build & deploy given Mage-OS composer repo"

on:
  workflow_call:
    inputs:
      repo:
        description: 'The composer repository url'
        required: true
        default: 'https://preview-mirror.mage-os.org/'
        type: string
      entrypoint:
        description: 'The Javascript command to use'
        required: true
        default: 'src/make/mirror.js'
        type: string
      remote_dir:
        description: 'Remote folder where the packages are stored'
        required: true
        default: '/var/www/preview-mirror.mage-os.org/html/'
        type: string
      delete:
        description: 'Remove remote files that do not exist in the build'
        required: false
        default: true
        type: boolean
      mageos_release:
        description: 'New Mage-OS version (e.g. 1.0.0)'
        required: false
        default: ''
        type: string
      upstream_release:
        description: 'Closest Magento Open Source version (e.g. 2.4.6-p2)'
        required: false
        default: ''
        type: string
      release_refs_file:
        description: 'Optional JS file mapping repos to git refs, used to build a line other than the default branch'
        required: false
        default: ''
        type: string
      publish_tag:
        description: 'Push new release tag to repos (TODO)'
        required: false
        default: false
        type: boolean
      ledger:
        description: 'Package ledger to check the build against (resource/ledger/{ledger}.tsv). Empty skips all ledger steps'
        required: false
        default: ''
        type: string
      enforce_ledger:
        description: 'Fail the deploy if it violates the ledger, and record newly published versions. Otherwise only report'
        required: false
        default: true
        type: boolean
      allow_ledger_changes:
        description: 'Deploy and record changed or missing already published packages instead of failing'
        required: false
        default: false
        type: boolean
      allow_ledger_alias_repoint:
        description: 'Accept changed alias metapackages that now require a package version published by this deploy'
        required: false
        default: false
        type: boolean

    secrets:
      SERVER_SSH_KEY:
        description: "SSH Key used to upload to the satis server."
        required: true
      REMOTE_USER:
        description: "The system user used to upload to the satis server."
        required: true
      REMOTE_HOST:
        description: "Override the SSH host used for deployment. Set this to the origin IP or an unproxied/DNS-only hostname when repo.mage-os.org is behind the Cloudflare proxy (SSH/port 22 is not proxied). Falls back to repo.mage-os.org when unset."
        required: false

env:
  remote_host: "repo.mage-os.org"
  remote_dir: ${{ inputs.remote_dir }}
  repo: ${{ inputs.repo }}
  entrypoint: ${{ inputs.entrypoint }}
  delete_arg: ${{ inputs.delete && '--delete' || '' }}
  mageos_release: ${{ inputs.mageos_release }}
  mageos_release_arg: ${{ inputs.mageos_release != '' && format('--mageosRelease="{0}"', inputs.mageos_release) || '' }}
  upstream_release_arg: ${{ inputs.upstream_release != '' && format('--upstreamRelease="{0}"', inputs.upstream_release) || '' }}
  release_refs_file_arg: ${{ inputs.release_refs_file != '' && format('--releaseRefsFile="{0}"', inputs.release_refs_file) || '' }}
  publish_tag: ${{ inputs.publish_tag }}
  ledger_file: ${{ inputs.ledger != '' && format('resource/ledger/{0}.tsv', inputs.ledger) || '' }}
  ledger_mode_arg: ${{ inputs.enforce_ledger && '--mode=gate --update' || '--mode=report --expectDiff="*/project-community-edition-*,*/project-minimal-edition-*"' }}
  ledger_allow_changes_arg: ${{ inputs.allow_ledger_changes && '--allowChanges' || '' }}
  ledger_alias_repoint_arg: ${{ inputs.allow_ledger_alias_repoint && '--allowAliasRepoint' || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: "Deploy ${{ inputs.repo }}"
    steps:
      - uses: actions/checkout@v3
      # The ledger is recorded on the branch the workflow runs from. Recorded anywhere but on the default branch,
      # the next deploy from the default branch would stamp those versions with a new published-time.
      - run: |
          echo "::error::Deploys recording to the package ledger have to run from the ${{ github.event.repository.default_branch }} branch"
          exit 1
        name: "Require the default branch to record to the package ledger"
        if: ${{ inputs.ledger != '' && inputs.enforce_ledger && github.ref_name != github.event.repository.default_branch }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:2.7
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
      - run: curl -L https://github.com/mage-os/php-dependency-list/raw/main/php-classes.phar -o /usr/local/bin/php-classes.phar && chmod +x /usr/local/bin/php-classes.phar
        name: "Install PHP source code dependency analyzer and make executable (used by nightly build script for base package)"

      - run: npm ci
      - run: |
          node ${{ env.entrypoint }} --outputDir=build/packages --gitRepoDir=generate-repo/repositories --repoUrl="${{ env.repo }}" \
            ${{ env.mageos_release_arg }} ${{ env.upstream_release_arg }} ${{ env.release_refs_file_arg }}
        name: "Generate the packages for the composer repo"

      # The packages above are generated with PHP 8.3 and composer 2.7. Satis requires PHP 8.4 and composer 2.11 or newer.
      - uses: shivammathur/setup-php@v2
        name: "Switch to the PHP version satis requires"
        with:
          php-version: 8.4
          tools: composer:v2
      # Composer create-project and composer require have limited support for commit hashes, they check composer-plugin-api constraints
      # of the specified branch HEAD instead of the specified commit hash.
      #- run: composer create-project "composer/satis:dev-main#3827428ee5d46c12de269f0ffa13d40a0dacaee0"
      # To work around the limitation, we use: git clone && git install.
      #
      # The pinned commit has to include https://github.com/composer/satis/pull/1238, which makes satis emit the
      # published-time composer cooldown policies depend on, taking it from the p2 files already in the output dir.
      - run: git clone https://github.com/composer/satis.git satis && cd satis && git checkout 3827428ee5d46c12de269f0ffa13d40a0dacaee0 && composer install && cd -
        name: "Install satis"

      - run: node bin/set-satis-homepage-url.js --satisConfig=satis.json --repoUrl="${{ env.repo }}" > /tmp/satis.json
        name: "Configure satis repository URL so composer knows where to download packages from"
      - run: cat <<< $(jq '."output-dir" = "../build" | .repositories[0].url = "../build/packages"' /tmp/satis.json) > /tmp/satis.json
        name: "Tell satis where to find the generated packages"
      - run: |
          cp mageos.html.twig satis/views/mageos.html.twig
          jq -r .version package.json > satis/views/version
        name: "Add generator version number to Satis HTML"
      # Satis stamps every version it has no previous published-time for with the time of the build
      - run: node bin/package-ledger.js seed --ledger="${{ env.ledger_file }}" --satisOutputDir=build
        name: "Seed satis with the published-time of the packages in the ledger"
        if: ${{ inputs.ledger != '' }}
      - run: cd satis && bin/satis build /tmp/satis.json ../build && cd -
        name: "Run satis"
      - run: cd satis && node ../bin/set-satis-output-url-prefix.js --satisOutputDir=../build --repoUrl="${{ env.repo }}" && cd -
        name: "Fix path to packages in the packages.json satis created"

      - run: |
          node bin/package-ledger.js verify --ledger="${{ env.ledger_file }}" --satisOutputDir=build --repoUrl="${{ env.repo }}" \
            ${{ env.ledger_mode_arg }} ${{ env.ledger_allow_changes_arg }} ${{ env.ledger_alias_repoint_arg }}
        name: "Verify the packages against the ledger"
        if: ${{ inputs.ledger != '' }}
      # This job has no token that can push. The record-ledger.yml job of the same workflow run commits the ledger.
      - uses: actions/upload-artifact@v4
        name: "Hand the ledger over to the job recording it"
        if: ${{ inputs.ledger != '' && inputs.enforce_ledger }}
        with:
          name: package-ledger-${{ inputs.ledger }}-${{ github.run_attempt }}
          path: ${{ env.ledger_file }}
          if-no-files-found: error
      # Nothing is uploaded before the ledger is on the branch, so the server never has a version the ledger does not know about
      - run: |
          for attempt in $(seq 1 60); do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            if git show "FETCH_HEAD:$ledger_file" | cmp --silent - "$ledger_file"; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::The package ledger was not recorded on the $GITHUB_REF_NAME branch"
          exit 1
        name: "Wait for the ledger to be recorded"
        if: ${{ inputs.ledger != '' && inputs.enforce_ledger }}

      - uses: easingthemes/ssh-deploy@v4
        name: "Rsync over SSH"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST || env.remote_host }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ env.remote_dir }}
          ARGS: "--verbose --compress --recursive --links --times --omit-dir-times ${{ env.delete_arg }}"
          SOURCE: "build/*"

      - run: cd generate-repo && tar -cf ../release-build-working-copies-${{ env.mageos_release }}.tar repositories && cd ..
        name: Tar git working copies
        if: ${{ success() && env.mageos_release != '' && env.publish_tag == 'true' }}
      - uses: actions/upload-artifact@v4
        if: ${{ success() && env.mageos_release != '' && env.publish_tag  == 'true' }}
        with:
          name: release-build-working-copies-${{ env.mageos_release }}
          path: release-build-working-copies-${{ env.mageos_release }}.tar
