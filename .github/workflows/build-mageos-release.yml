name: Build, deploy & check Release

on:
  schedule:
    # Weekly preview deploy of the current release line, to check the build still reproduces the ledger
    - cron: '40 5 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'The composer repository url'
        required: true
        default: 'https://preview-repo.mage-os.org/'
        type: choice
        options:
          - https://preview-repo.mage-os.org/
          - https://repo.mage-os.org/
      mageos_release:
        description: 'New Mage-OS version (e.g. 1.0.0)'
        required: false
        default: ''
        type: string
      upstream_release:
        description: 'Closest Magento Open Source version for new release (e.g. 2.4.6-p2)'
        required: false
        default: ''
        type: string
      release_refs_file:
        description: 'Optional refs file for a grace-window release, e.g. src/build-config/mage-os-release-refs/3.4.1.js'
        required: false
        default: ''
        type: string
      publish_tag:
        description: 'Push new release tag to repos'
        required: false
        default: false
        type: boolean
      full_rebuild:
        description: 'Production only: rebuild every package instead of adding the new ones to the live metadata. Previews always rebuild everything'
        required: false
        default: false
        type: boolean

# One release build per target repo at a time; never auto-cancel a release
# mid-deploy or mid-tag-push. The target is production whenever the ledger is recorded, as each
# production build adds to the metadata the previous one uploaded.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.repo == 'https://repo.mage-os.org/' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    name: "generate & deploy"
    if: ${{ github.event_name == 'schedule' || contains(fromJSON('["vinai", "rhoerr", "marcelmtz", "mage-os-ci"]'), github.actor) }}
    permissions:
      contents: read
    with:
      repo: ${{ inputs.repo || 'https://preview-repo.mage-os.org/' }}
      remote_dir: ${{ inputs.repo == 'https://repo.mage-os.org/' && '/var/www/repo.mage-os.org/html/' || '/var/www/preview-repo.mage-os.org/html/' }}
      entrypoint: src/make/mageos-release.js
      delete: false
      mageos_release: ${{ inputs.mageos_release }}
      upstream_release: ${{ inputs.upstream_release }}
      publish_tag: ${{ inputs.publish_tag == true }}
      release_refs_file: ${{ inputs.release_refs_file }}
      ledger: release
      enforce_ledger: ${{ inputs.repo == 'https://repo.mage-os.org/' }}
      full_rebuild: ${{ inputs.full_rebuild == true }}

    secrets:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  record-ledger:
    uses: ./.github/workflows/record-ledger.yml
    name: "record ledger"
    if: ${{ contains(fromJSON('["vinai", "rhoerr", "marcelmtz", "mage-os-ci"]'), github.actor) && inputs.repo == 'https://repo.mage-os.org/' }}
    permissions:
      contents: write
      actions: read
    with:
      ledger: release
  compute-release-service-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supported-version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v3
      - uses: mage-os/github-actions/supported-version@main
        with:
          project: 'mage-os'
          kind: 'usable'
        id: supported-version
  integration-check:
    name: "installation check"
    needs: [ deploy, compute-release-service-versions ]
    uses: mage-os/github-actions/.github/workflows/integration.yaml@main
    with:
      package_name: mage-os/demo-package
      use_local_source: false
      matrix: ${{ needs.compute-release-service-versions.outputs.matrix }}
      test_command: ../../../vendor/bin/phpunit ../../../vendor/mage-os/demo-package/Test/Integration
      fail-fast: false
      magento_repository: ${{ inputs.repo || 'https://preview-repo.mage-os.org/' }}
      composer_cache_key: ${{ inputs.composer_cache_key || 'v1' }}
  publish-release-tag:
    name: "Publish release tag"
    if: ${{ success() && inputs.mageos_release && inputs.publish_tag }}
    needs: [ deploy, record-ledger ]
    uses: ./.github/workflows/push-release-tag.yml
    permissions:
      actions: read
    with:
      mageos_release: ${{ inputs.mageos_release }}

    secrets:
      MAGE_OS_CI_TOKEN: ${{ secrets.MAGE_OS_CI_TOKEN }}
