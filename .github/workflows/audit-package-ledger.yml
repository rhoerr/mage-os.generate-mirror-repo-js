name: Audit package ledger

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    name: "Audit ${{ matrix.ledger }} ledger"
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - ledger: mirror
            repo: https://mirror.mage-os.org/
          - ledger: release
            repo: https://repo.mage-os.org/
    env:
      ledger: ${{ matrix.ledger }}
      repo: ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: "Compare the live metadata with the ledger"
        id: audit
        shell: bash
        run: |
          set -o pipefail
          node bin/package-ledger.js audit --checkTimes --ledger="resource/ledger/$ledger.tsv" --repoUrl="$repo" 2>&1 | tee "$RUNNER_TEMP/audit.log"
      - name: "Open, update or close the audit issue"
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          outcome: ${{ steps.audit.outcome }}
        run: node bin/ledger-audit-issue.js --ledger="$ledger" --repoUrl="$repo" --outcome="$outcome" --log="$RUNNER_TEMP/audit.log"
