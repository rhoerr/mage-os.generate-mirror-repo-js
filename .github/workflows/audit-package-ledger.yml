name: Audit package ledger

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    name: "Audit ${{ matrix.ledger }} ledger"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ledger: mirror
            repo: https://mirror.mage-os.org/
          - ledger: release
            repo: https://repo.mage-os.org/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: "Compare the live metadata with the ledger"
        run: node bin/package-ledger.js audit --checkTimes --ledger=resource/ledger/${{ matrix.ledger }}.tsv --repoUrl=${{ matrix.repo }}
