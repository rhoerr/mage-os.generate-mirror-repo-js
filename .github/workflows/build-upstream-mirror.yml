name: Build, deploy & check Mirror

on:
  schedule:
    # Weekly preview deploy, to check the build still reproduces the ledger
    - cron: '40 4 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'The composer repository url'
        required: true
        default: 'https://preview-mirror.mage-os.org/'
        type: choice
        options:
          - https://preview-mirror.mage-os.org/
          - https://mirror.mage-os.org/
      full_rebuild:
        description: 'Production only: rebuild every package instead of adding the new ones to the live metadata. Previews always rebuild everything'
        required: false
        default: false
        type: boolean

# One build per deploy target at a time; queue rather than cancel so an
# in-progress rsync is never interrupted mid-deploy. The target is production whenever the ledger is
# recorded, as each production build adds to the metadata the previous one uploaded.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.repo == 'https://mirror.mage-os.org/' && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    name: "generate & deploy"
    if: ${{ github.event_name == 'schedule' || contains(fromJSON('["vinai", "rhoerr", "marcelmtz", "mage-os-ci"]'), github.actor) }}
    permissions:
      contents: read
    with:
      repo: ${{ (github.event_name == 'workflow_dispatch' && inputs.repo) || 'https://preview-mirror.mage-os.org/' }}
      remote_dir: ${{ inputs.repo == 'https://mirror.mage-os.org/' && '/var/www/mirror.mage-os.org/html/' || '/var/www/preview-mirror.mage-os.org/html/' }}
      entrypoint: src/make/mirror.js
      delete: true
      ledger: mirror
      enforce_ledger: ${{ inputs.repo == 'https://mirror.mage-os.org/' }}
      full_rebuild: ${{ inputs.full_rebuild == true }}
    secrets:
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  record-ledger:
    uses: ./.github/workflows/record-ledger.yml
    name: "record ledger"
    if: ${{ contains(fromJSON('["vinai", "rhoerr", "marcelmtz", "mage-os-ci"]'), github.actor) && inputs.repo == 'https://mirror.mage-os.org/' }}
    permissions:
      contents: write
      actions: read
    with:
      ledger: mirror

  integrity-check:
    needs: [deploy]
    uses: ./.github/workflows/integrity-check.yml
    with:
      repo: ${{ (github.event_name == 'workflow_dispatch' && inputs.repo) || 'https://preview-mirror.mage-os.org/' }}
    secrets:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
